---
# Minimal device scaffolding shared by the config-validation tests.
# Not intended for flashing; see example-gdo.yaml for a real config.
esphome:
  name: test-gdo
  friendly_name: Test GDO
esp8266:
  board: d1_mini
  restore_from_flash: true
preferences:
  flash_write_interval: "24h"
logger:
wifi:
  ssid: "test-ssid"
  password: "test-password"
external_components:
  # Validate the components in this working tree, not the published ones.
  - source:
      type: local
      path: ../components
